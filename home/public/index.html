<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>הפרויקטים</title>

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="הפרויקטים">
    <meta name="theme-color" content="rgb(237, 216, 255)">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="img/winged_star.png">
    <link rel="apple-touch-icon" sizes="152x152" href="img/winged_star.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/winged_star.png">
    <link rel="apple-touch-icon" sizes="167x167" href="img/winged_star.png">

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Regular Stylesheets and Icons -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/winged_star.png" type="image/png">
</head>

<body>
    <section class="strip">
        <h1>הפרויקטים</h1>
        <div id="projects-container" class="stars">
        </div>
    </section>

    <button id="open-editor-btn" type="button" class="fab" aria-label="ניהול קישורים" title="ניהול קישורים">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
        </svg>
    </button>

    <div id="editor-overlay" class="editor-overlay" hidden>
        <div class="editor-panel" id="editor-panel">
            <div class="editor-topbar">
                <div class="editor-header">
                    <h2>ניהול קישורים</h2>
                    <button id="close-editor-btn" type="button" aria-label="סגור">✕</button>
                </div>
                <p id="editor-status" class="editor-status"></p>
            </div>

            <div class="editor-scroll" id="editor-scroll">
                <div id="password-gate" class="password-gate">
                    <input id="password-input" type="password" placeholder="סיסמת עריכה" autocomplete="current-password">
                    <button id="unlock-btn" type="button" class="button">כניסה</button>
                </div>

                <div id="editor-body" hidden>
                    <div id="sections-list" class="sections-list"></div>

                    <form id="add-section-form" class="add-section-form">
                        <h3>הוספת מקטע חדש</h3>
                        <div class="add-row">
                            <input id="new-section-name" type="text" placeholder="שם המקטע" required>
                            <button type="submit" class="button">הוספת מקטע</button>
                        </div>
                        <label class="private-toggle">
                            <input id="new-section-private" type="checkbox">
                            לשימוש אישי בלבד (מוסתר מהדף הציבורי)
                        </label>
                    </form>

                    <form id="add-link-form" class="add-link-form">
                        <h3>הוספת קישור חדש</h3>
                        <select id="new-link-section"></select>
                        <div class="add-row">
                            <input id="new-url" type="url" placeholder="כתובת האתר (https://...)" required>
                            <button id="fetch-meta-btn" type="button" class="button">שאיבת שם</button>
                        </div>
                        <input id="new-name" type="text" placeholder="שם האתר" required>
                        <textarea id="new-description" placeholder="תיאור (אופציונלי)" rows="2"></textarea>
                        <div id="new-preview" class="preview-row"></div>
                        <button type="submit" class="button">הוספת קישור</button>
                    </form>
                </div>
            </div>

            <div class="editor-footer" id="editor-footer" hidden>
                <button id="save-links-btn" type="button" class="button save-btn">שמירת שינויים</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(() => console.log('ServiceWorker registration successful'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
